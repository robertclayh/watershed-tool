[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiat"
version = "0.1.0"
description = "Watershed Intervention Attribution Toolkit: DiD and synthetic control for nature-based watershed interventions, with explicit failure diagnostics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["hydrology", "causal inference", "synthetic control", "difference-in-differences", "earth engine", "nature-based solutions"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.380"]
geo = ["geopandas>=0.14"]
dev = ["pytest>=7"]

[project.scripts]
wiat = "wiat.cli:main"

[tool.setuptools.packages.find]
include = ["wiat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
